<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="R・パターン・Jの有無から固定データを検索するツール" />
    <title>Horsie Data Lookup</title>
    <link rel="stylesheet" href="style.css" />
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">DATA LOOKUP</p>
        <h1>Horsie</h1>
        <p class="intro">条件を選んで、対応する固定データを確認します。</p>
      </header>

      <section class="control-panel" aria-label="検索条件">
        <div class="control-block">
          <div class="control-heading">
            <h2>Race</h2>
            <span class="keyboard-hint"><kbd>Space</kbd> 次へ・<kbd>Alt</kbd> + <kbd>Space</kbd> 前へ</span>
          </div>
          <div class="r-scroller">
            <div id="r-control" class="segmented segmented--race" role="group" aria-label="Raceを選択">
              <button type="button" data-r="1" aria-pressed="true">1R</button>
              <button type="button" data-r="2" aria-pressed="false">2R</button>
              <button type="button" data-r="3" aria-pressed="false">3R</button>
              <button type="button" data-r="4" aria-pressed="false">4R</button>
              <button type="button" data-r="5" aria-pressed="false">5R</button>
              <button type="button" data-r="6" aria-pressed="false">6R</button>
              <button type="button" data-r="7" aria-pressed="false">7R</button>
              <button type="button" data-r="8" aria-pressed="false">8R</button>
              <button type="button" data-r="9" aria-pressed="false">9R</button>
              <button type="button" data-r="10" aria-pressed="false">10R</button>
              <button type="button" data-r="11" aria-pressed="false">11R</button>
              <button type="button" data-r="12" aria-pressed="false">12R</button>
            </div>
          </div>
        </div>

        <div class="condition-grid">
          <div class="control-block">
            <h2>Pattern</h2>
            <div id="y-control" class="segmented" role="group" aria-label="Patternを選択">
              <button type="button" data-value="D2" aria-pressed="false">D2</button>
              <button type="button" data-value="DD" aria-pressed="true">DD</button>
            </div>
          </div>

          <div class="control-block">
            <h2>Joker</h2>
            <div id="z-control" class="segmented" role="group" aria-label="Jokerを選択">
              <button type="button" data-value="" aria-label="Jなし" aria-pressed="true"><s aria-hidden="true">J</s></button>
              <button type="button" data-value="J" aria-pressed="false">J</button>
              <button type="button" data-value="JJ" aria-pressed="false">JJ</button>
            </div>
          </div>
        </div>
      </section>

      <section class="result-panel" aria-labelledby="result-title">
        <div class="result-heading">
          <div>
            <p class="section-label">CURRENT KEY</p>
            <h2 id="result-title"><output id="current-key">MDD</output></h2>
          </div>
          <p class="key-detail"><span id="current-r">1R</span><span aria-hidden="true">/</span>x = <strong id="current-x">M</strong></p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th scope="col">項目</th><th scope="col">値</th></tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
          <p id="empty-state" class="empty-state">このキーのデータはありません</p>
        </div>
      </section>

      <section class="settings-panel" aria-labelledby="settings-title">
        <div class="settings-heading">
          <p class="section-label">DISPLAY</p>
          <h2 id="settings-title">数値表示設定</h2>
        </div>

        <fieldset class="rounding-options">
          <legend>表示方法</legend>
          <label><input type="radio" name="rounding" value="raw" checked /><span>実値</span></label>
          <label><input type="radio" name="rounding" value="floor-half" /><span>0.5単位切り捨て</span></label>
          <label><input type="radio" name="rounding" value="floor-integer" /><span>整数切り捨て</span></label>
          <label><input type="radio" name="rounding" value="round-half" /><span>0.5単位四捨五入</span></label>
          <label><input type="radio" name="rounding" value="round-integer" /><span>整数単位四捨五入</span></label>
        </fieldset>

        <div class="tax-field">
          <label for="tax-rate">Tax Rate</label>
          <div class="number-input-wrap">
            <input id="tax-rate" type="number" value="0" min="0" max="100" step="any" inputmode="decimal" aria-describedby="tax-help tax-error" />
            <span aria-hidden="true">%</span>
          </div>
          <p id="tax-help" class="field-help">0以上100以下で入力してください。</p>
          <p id="tax-error" class="field-error" role="alert" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
