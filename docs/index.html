<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="レース条件から馬券の確率とフェアオッズを確認するツール" />
    <title>Horsie Odds</title>
    <link rel="stylesheet" href="style.css?v=3c8e299fc931" />
    <script src="data.js?v=75e499226db3" defer></script>
    <script src="odds-data.js?v=2aa7a87fa0c5" defer></script>
    <script src="calculator.js?v=4ee369167b14" defer></script>
    <script src="app.js?v=a7088346cb09" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="workspace-grid">
      <section class="control-panel" aria-label="レース条件選択">
        <div class="control-block">
          <div class="control-heading">
            <span class="keyboard-hint"><kbd>Space</kbd> 次へ・<kbd>Ctrl</kbd> + <kbd>Space</kbd> 前へ・<kbd>D</kbd> Pattern・<kbd>J</kbd> Joker・<kbd>0–9</kbd> 入力・<kbd>Backspace</kbd> 1桁削除・<kbd>C</kbd> クリア</span>
          </div>
          <div class="r-scroller">
            <div id="r-control" class="segmented segmented--race" role="group" aria-label="Raceを選択" aria-keyshortcuts="Space Control+Space">
              <button type="button" data-r="1" aria-pressed="true">1R</button>
              <button type="button" data-r="2" aria-pressed="false">2R</button>
              <button type="button" data-r="3" aria-pressed="false">3R</button>
              <button type="button" data-r="4" aria-pressed="false">4R</button>
              <button type="button" data-r="5" aria-pressed="false">5R</button>
              <button type="button" data-r="6" aria-pressed="false">6R</button>
              <button type="button" data-r="7" aria-pressed="false">7R</button>
              <button type="button" data-r="8" aria-pressed="false">8R</button>
              <button type="button" data-r="9" aria-pressed="false">9R</button>
              <button type="button" data-r="10" aria-pressed="false">10R</button>
              <button type="button" data-r="11" aria-pressed="false">11R</button>
              <button type="button" data-r="12" aria-pressed="false">12R</button>
            </div>
          </div>
        </div>
        <div class="condition-grid" aria-label="検索条件">
          <div class="control-block">
            <h2>Pattern</h2>
            <div id="y-control" class="segmented" role="group" aria-label="Patternを選択" aria-keyshortcuts="D">
              <button type="button" data-value="D2" aria-pressed="false">D2</button>
              <button type="button" data-value="DD" aria-pressed="true">DD</button>
            </div>
          </div>

          <div class="control-block">
            <h2>Joker</h2>
            <div id="z-control" class="segmented" role="group" aria-label="Jokerを選択" aria-keyshortcuts="J">
              <button type="button" data-value="" aria-label="Jなし" aria-pressed="true"><s aria-hidden="true">J</s></button>
              <button type="button" data-value="J" aria-pressed="false">J</button>
              <button type="button" data-value="JJ" aria-pressed="false">JJ</button>
            </div>
          </div>
        </div>
      </section>

      <section class="result-panel" aria-labelledby="result-title">
        <div class="result-heading">
          <h2 id="result-title"><output id="current-title">中距離DD</output></h2>
        </div>

        <div class="table-wrap">
          <table id="odds-table" data-show-probability="true" aria-label="オッズ一覧">
            <tbody id="result-body"></tbody>
          </table>
          <p id="empty-state" class="empty-state">このキーのデータはありません</p>
        </div>
      </section>

      <section class="calculator-panel" aria-labelledby="calculator-title">
        <div class="calculator-heading">
          <p class="section-label">CALCULATOR</p>
          <h2 id="calculator-title">電卓</h2>
        </div>
        <div class="outcome-field">
          <h3 id="outcome-label">実際の結果</h3>
          <div id="outcome-control" class="outcome-buttons" role="group" aria-labelledby="outcome-label"></div>
        </div>

        <div class="calculation-grid">
          <div class="amount-field">
            <label for="chip-amount">入力</label>
            <input id="chip-amount" type="text" value="0" readonly tabindex="-1" aria-describedby="amount-error" />
          </div>
          <div id="chip-control" class="chip-buttons" role="group" aria-label="チップを加算">
            <button type="button" data-chip="1" aria-label="1チップ加算"><img src="chips/chip1.svg" width="64" height="64" alt="" /><span>+1</span></button>
            <button type="button" data-chip="5" aria-label="5チップ加算"><img src="chips/chip5.svg" width="64" height="64" alt="" /><span>+5</span></button>
            <button type="button" data-chip="10" aria-label="10チップ加算"><img src="chips/chip10.svg" width="64" height="64" alt="" /><span>+10</span></button>
            <button type="button" data-chip="25" aria-label="25チップ加算"><img src="chips/chip25.svg" width="64" height="64" alt="" /><span>+25</span></button>
            <button type="button" data-chip="100" aria-label="100チップ加算"><img src="chips/chip100.svg" width="64" height="64" alt="" /><span>+100</span></button>
            <button id="clear-amount" class="clear-amount" type="button">クリア</button>
          </div>
          <span class="calculation-times" aria-hidden="true">×</span>
          <div class="calculation-row">
            <div class="calculation-rate"><span id="win-label">単勝</span><output id="win-multiplier" aria-label="単勝の倍率">—</output></div>
            <span class="calculation-equals" aria-hidden="true">=</span>
            <output id="win-result" class="calculation-result" for="chip-amount" aria-label="単勝の計算結果">—</output>
          </div>
          <div class="calculation-row">
            <div class="calculation-rate"><span id="exacta-label">2連単</span><output id="exacta-multiplier" aria-label="2連単の倍率">—</output></div>
            <span class="calculation-equals" aria-hidden="true">=</span>
            <output id="exacta-result" class="calculation-result" for="chip-amount" aria-label="2連単の計算結果">—</output>
          </div>
          <div class="calculation-row">
            <div class="calculation-rate"><span id="trifecta-label">三連単</span><output id="trifecta-multiplier" aria-label="三連単の倍率">—</output></div>
            <span class="calculation-equals" aria-hidden="true">=</span>
            <output id="trifecta-result" class="calculation-result" for="chip-amount" aria-label="三連単の計算結果">—</output>
          </div>
        </div>
        <p id="amount-error" class="field-error" role="alert"></p>
      </section>

      <aside id="settings-panel" class="settings-panel" aria-labelledby="settings-title">
        <div class="settings-heading">
          <div>
          <p class="section-label">DISPLAY</p>
          <h2 id="settings-title">数値表示設定</h2>
          </div>
        </div>
        <label class="column-option" for="show-probability">
          <input id="show-probability" type="checkbox" checked aria-controls="odds-table" />
          <span>的中確率を表示</span>
        </label>

        <fieldset class="rounding-options">
          <legend>表示方法</legend>
          <div class="rounding-kind" role="group" aria-label="実値または丸めを選択">
            <label><input type="radio" name="rounding-kind" value="raw" checked /><span>実値</span></label>
            <label><input type="radio" name="rounding-kind" value="rounded" /><span>丸め</span></label>
          </div>
          <div id="rounding-details" class="rounding-details" hidden>
            <fieldset id="rounding-unit-options" disabled>
              <legend>単位</legend>
              <label><input type="radio" name="rounding-unit" value="tenth" checked /><span>0.1</span></label>
              <label><input type="radio" name="rounding-unit" value="half" /><span>0.5</span></label>
              <label><input type="radio" name="rounding-unit" value="integer" /><span>整数</span></label>
            </fieldset>
            <fieldset id="rounding-direction-options" disabled>
              <legend>方法</legend>
              <label><input type="radio" name="rounding-direction" value="floor" checked /><span>切り捨て</span></label>
              <label><input type="radio" name="rounding-direction" value="round" /><span>四捨五入</span></label>
            </fieldset>
          </div>
        </fieldset>

        <fieldset class="tax-settings">
          <legend>Tax Rate</legend>
          <p id="tax-help" class="field-help">各券種 0〜100%</p>
          <div class="tax-fields">
            <div class="tax-field">
              <label for="tax-rate-win">単勝</label>
              <div class="number-input-wrap">
                <input id="tax-rate-win" class="tax-rate-input" data-wager="Win" type="number" value="0" min="0" max="100" step="any" inputmode="decimal" aria-describedby="tax-help tax-error-win" />
                <span aria-hidden="true">%</span>
              </div>
              <p id="tax-error-win" class="field-error" role="alert" aria-live="polite"></p>
            </div>
            <div class="tax-field">
              <label for="tax-rate-exacta">2連単</label>
              <div class="number-input-wrap">
                <input id="tax-rate-exacta" class="tax-rate-input" data-wager="Exacta" type="number" value="0" min="0" max="100" step="any" inputmode="decimal" aria-describedby="tax-help tax-error-exacta" />
                <span aria-hidden="true">%</span>
              </div>
              <p id="tax-error-exacta" class="field-error" role="alert" aria-live="polite"></p>
            </div>
            <div class="tax-field">
              <label for="tax-rate-trifecta">三連単</label>
              <div class="number-input-wrap">
                <input id="tax-rate-trifecta" class="tax-rate-input" data-wager="Trifecta" type="number" value="0" min="0" max="100" step="any" inputmode="decimal" aria-describedby="tax-help tax-error-trifecta" />
                <span aria-hidden="true">%</span>
              </div>
              <p id="tax-error-trifecta" class="field-error" role="alert" aria-live="polite"></p>
            </div>
          </div>
        </fieldset>
      </aside>
      </div>
    </main>
  </body>
</html>
